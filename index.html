<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameDex - Master Admin</title>
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header>
    <h1 id="main-title">Control de Misión 🎮</h1>
    <p class="subtitle">Sistemas Transaccionales Activos</p>
</header>

<main>
    <section>
        <label for="characterInput">Nombre del Héroe:</label>
        <input type="text" id="characterInput" placeholder="Ej: Mario" />
        <button type="button" id="btnSearch">Buscar</button>
    </section>

    <article class="data-display">
        <h2>Panel de Resultados</h2>
        <img src="images/image.png" width="100" height="100" />

        <div class="stats-grid">
            <p>Estadísticas del Servidor:</p>
            <ul>
                <li>Latencia: 20ms</li>
                <li>Estado: Online</li>
            </ul>
        </div>
    </article>

    <article id="resultArea" class="result-card">
        <p id="message">Elige un personaje para ver sus stats.</p>
    </article>
</main>

<footer>
    <div id="footer-data">
        <p>&copy; 2026 GameDex Corp - Cloud Ready</p>
    </div>
</footer>

<script src="js/script.js"></script>

</body>
</html>
